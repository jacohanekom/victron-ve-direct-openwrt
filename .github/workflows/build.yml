name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Backstop for a hung SDK download (observed: setup.sh's "wget -nv"
    # fetching the SDK tarball from downloads.openwrt.org's mirror
    # network can silently stall for 1h+ with zero log output, since
    # -nv suppresses wget's own progress reporting -- this isn't
    # caused by anything in this repo, just fail fast instead of
    # burning hours of runner time on a dead mirror. Sized against
    # this matrix's two lightweight packages (~10-17m when healthy),
    # not the much heavier victron-ve-direct-collectd (see PACKAGES
    # below), which is deliberately excluded from CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generic sanity check -- fastest SDK image, catches anything
          # arch-independent (UCI parsing, protocol logic, the LuCI JS
          # view/rpcd script).
          - arch: x86-64-v24.10.4
            name: x86_64 (sanity check)

          # Matches the actual deploy target this whole pi-relay-control /
          # victron-ve-direct project suite is built for: a Raspberry Pi
          # 3/4-class (Cortex-A53) board running OpenWrt 24.10.4 (bcm27xx)
          # instead of Debian/Alpine.
          - arch: aarch64_cortex-a53-v24.10.4
            name: aarch64_cortex-a53 (Pi 3/4-class)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build via OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        timeout-minutes: 15
        env:
          ARCH: ${{ matrix.arch }}
          # victron-ve-direct-collectd is deliberately NOT built here.
          # It has zero compiled code of its own (a shell script, a
          # uci-defaults script, a JS definitions file -- pure
          # install-only package), but it DEPENDS on luci-app-statistics,
          # which pulls in collectd itself. Observed in practice:
          # building collectd from source drags in a much larger
          # transitive dependency tree than its own plugin list
          # suggests (curl, neon, mariadb-connector-c, mosquitto, nut,
          # unbound, libwebsockets...), taking 60-90+ minutes and
          # exposing every run to unrelated upstream mirror flakiness
          # -- disproportionate cost for a package with nothing of
          # its own to actually verify compiles.
          PACKAGES: victron-ve-direct luci-app-victron-ve-direct
          V: s

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.arch }}
          path: bin/packages/*/action/*.ipk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/*/action/*.ipk
