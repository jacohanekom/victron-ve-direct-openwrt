name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Backstop for a hung SDK download (observed: setup.sh's "wget -nv"
    # fetching the SDK tarball from downloads.openwrt.org's mirror
    # network can silently stall for 1h+ with zero log output, since
    # -nv suppresses wget's own progress reporting -- this isn't
    # caused by anything in this repo, just fail fast instead of
    # burning hours of runner time on a dead mirror. Sized against
    # this matrix's two lightweight packages, not the much heavier
    # victron-ve-direct-collectd (see PACKAGES below), which is
    # deliberately excluded from CI. The 25.12/apk entries run
    # noticeably slower than 24.10/opkg (~15m vs ~10m observed, apk
    # packaging/signing overhead plus a larger default kmod set) --
    # sized with headroom above that, not just the faster opkg case.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generic sanity check -- fastest SDK image, catches anything
          # arch-independent (UCI parsing, protocol logic, the LuCI JS
          # view/rpcd script).
          - arch: x86-64-v24.10.4
            name: x86_64 (sanity check, 24.10.4/opkg)
            ext: ipk

          # Matches the actual deploy target this whole pi-relay-control /
          # victron-ve-direct project suite is built for: a Raspberry Pi
          # Compute Module 5 (same BCM2712 SoC as the Pi 5, Cortex-A76
          # -- not the Cortex-A53 in Pi 3/4) running OpenWrt 24.10.4
          # (bcm27xx/bcm2712) instead of Debian/Alpine.
          - arch: aarch64_cortex-a76-v24.10.4
            name: aarch64_cortex-a76 (CM5/Pi 5-class, 24.10.4/opkg)
            ext: ipk

          # 25.12 switched OpenWrt's default package format from opkg
          # to apk -- built separately (not just a newer tag of the
          # same job) since the artifact extension itself differs.
          - arch: x86-64-v25.12.5
            name: x86_64 (sanity check, 25.12.5/apk)
            ext: apk

          - arch: aarch64_cortex-a76-v25.12.5
            name: aarch64_cortex-a76 (CM5/Pi 5-class, 25.12.5/apk)
            ext: apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build via OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        timeout-minutes: 25
        env:
          ARCH: ${{ matrix.arch }}
          # victron-ve-direct-collectd is deliberately NOT built here.
          # It has zero compiled code of its own (a shell script, a
          # uci-defaults script, a JS definitions file -- pure
          # install-only package), but it DEPENDS on luci-app-statistics,
          # which pulls in collectd itself. Observed in practice:
          # building collectd from source drags in a much larger
          # transitive dependency tree than its own plugin list
          # suggests (curl, neon, mariadb-connector-c, mosquitto, nut,
          # unbound, libwebsockets...), taking 60-90+ minutes and
          # exposing every run to unrelated upstream mirror flakiness
          # -- disproportionate cost for a package with nothing of
          # its own to actually verify compiles.
          PACKAGES: victron-ve-direct luci-app-victron-ve-direct
          V: s

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ext }}-${{ matrix.arch }}
          path: bin/packages/*/action/*.${{ matrix.ext }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/*/action/*.${{ matrix.ext }}
